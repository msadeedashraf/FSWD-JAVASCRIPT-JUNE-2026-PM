<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function</title>
  </head>
  <body>
    <h1>Function</h1>

    <h3 id="demo"></h3>
    <p id="greetmsg"></p>
    <button onclick="greetings('Sara')" >greet</button>

    <script>
      function greetings(name) 
      {
          document.getElementById('greetmsg').innerHTML = 'My name is '+name
      }

      function add(num1, num2)
      {
        return num1 + num2

      }
      //greetings("Frank")
      //greetings("Sara")

      document.getElementById('demo').innerHTML = add(9,5)
     

    </script>
  </body>
</html>
