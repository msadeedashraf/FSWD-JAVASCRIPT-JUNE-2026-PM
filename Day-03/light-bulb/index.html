<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Bulb</title>
</head>
<body>
  <h2>What Can JavaScript Do?</h2>

    <p>JavaScript can change HTML attribute values.</p>

    <p>
      In this case JavaScript changes the value of the src (source) attribute of
      an image.
    </p>
    <button onclick="document.getElementById('myimage').src = './images/pic_bulbon.gif'"  >On</button>
    <image id="myimage" src="./images/pic_bulboff.gif"></image>
    <button onclick="document.getElementById('myimage').src = './images/pic_bulboff.gif'"  >Off</button>
    
    
</body>
</html>
